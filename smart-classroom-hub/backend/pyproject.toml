[project]
name = "backend"
version = "0.1.0"
description = "Student-Friendly Smart Classroom Hub Backend"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    # Core Framework & API
    "django>=6.0",
    "djangorestframework>=3.16.1",
    "djangorestframework-simplejwt>=5.5.1",
    "django-cors-headers>=4.9.0",
    "djoser>=2.3.3",
    # Database & Cache
    "psycopg2-binary>=2.9.11",
    "django-redis>=6.0.0",
    "python-decouple>=3.8",
    # Real-time (WebSockets)
    "daphne>=4.2.1",
    "channels>=4.3.2",
    # AI & Face Recognition (Modern Stack)
    "deepface>=0.0.96",
    "tf-keras>=2.20.1",
    "opencv-python>=4.11.0.86",
    # Admin & UI Enhancement
    "django-admin-interface>=0.32.0",
    "django-crispy-forms>=2.5",
    "crispy-bootstrap4>=2025.6",
    # Utilities
    "celery>=5.6.1",
    "django-filter>=25.2",
    "pandas>=2.3.3",
    "matplotlib>=3.10.8",
]

